<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" width="960" height="200" role="img" aria-label="How a change gets in"><title>How a change gets in</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4D7C0F"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#111827" flood-opacity="0.07"/></filter></defs><rect width="960" height="200" rx="20" fill="#F5F6F8"/><rect x="28" y="60" width="136" height="76" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow)"/><text x="96.0" y="90.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">💬  Issue</text><text x="96.0" y="110.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">say what and why</text><path d="M166,98 L178,98" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="60" width="136" height="76" rx="14" fill="#ECF8C8" stroke="#D9EFA0" stroke-width="1.5" filter="url(#shadow)"/><text x="248.0" y="90.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A2E05">🌱  Branch</text><text x="248.0" y="110.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4D7C0F">type/short-name</text><path d="M318,98 L330,98" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><rect x="332" y="60" width="136" height="76" rx="14" fill="#C6F432" stroke="#C6F432" stroke-width="1.5" filter="url(#shadow)"/><text x="400.0" y="90.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A2E05">📦  Small PR</text><text x="400.0" y="110.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A2E05">< 500 lines · < 100 files</text><path d="M470,98 L482,98" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><rect x="484" y="60" width="136" height="76" rx="14" fill="#ECF8C8" stroke="#D9EFA0" stroke-width="1.5" filter="url(#shadow)"/><text x="552.0" y="90.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A2E05">✅  CI green</text><text x="552.0" y="110.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4D7C0F">lint · types · tests</text><path d="M622,98 L634,98" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><rect x="636" y="60" width="136" height="76" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow)"/><text x="704.0" y="90.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">👀  Review</text><text x="704.0" y="110.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">one approval</text><path d="M774,98 L786,98" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><rect x="788" y="60" width="136" height="76" rx="14" fill="#0E0F11" stroke="#0E0F11" stroke-width="1.5" filter="url(#shadow)"/><text x="856.0" y="90.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6E6E6">🚀  Merge</text><text x="856.0" y="110.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C6F432">squash into main</text><text x="480" y="175" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6B7280">One thing per PR, with its tests. Big ideas start as an issue so we agree before the code.</text></svg>
