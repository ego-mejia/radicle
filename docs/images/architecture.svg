xt x="775.0" y="252.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4D7C0F">/b/{slug} · ALTCHA</text><rect x="60" y="290" width="840" height="26" rx="14" fill="#F1F2F4" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow)"/><text x="480.0" y="308.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827"></text><text x="480" y="308" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#1A2E05">services/  ·  permissions, RQL, workflows, inbox, audit  ·  the only place with business logic</text><path d="M185.0,122 L185.0,205" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><path d="M480.0,122 L480.0,205" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><path d="M775.0,122 L775.0,205" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="370" width="250" height="70" rx="14" fill="#0E0F11" stroke="#0E0F11" stroke-width="1.5" filter="url(#shadow)"/><text x="185.0" y="397.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6E6E6">🐘  PostgreSQL 16</text><text x="185.0" y="417.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C6F432">data, full-text, job queue</text><rect x="355" y="370" width="250" height="70" rx="14" fill="#C6F432" stroke="#C6F432" stroke-width="1.5" filter="url(#shadow)"/><text x="480.0" y="397.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A2E05">⚙️  Worker</text><text x="480.0" y="417.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial,