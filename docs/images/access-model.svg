<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-label="Who can see and do what"><title>Who can see and do what</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4D7C0F"/></marker><filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#111827" flood-opacity="0.07"/></filter></defs><rect width="960" height="250" rx="20" fill="#F5F6F8"/><rect x="30" y="90" width="150" height="66" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow)"/><text x="105.0" y="115.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">👤  User</text><text x="105.0" y="135.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">or agent</text><rect x="220" y="30" width="170" height="66" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow)"/><text x="305.0" y="55.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">👥  Groups</text><text x="305.0" y="75.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">legal-team, backend</text><rect x="220" y="150" width="170" height="66" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5" filter="url(#shadow)"/><text x="305.0" y="175.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#111827">🏷️  Direct role</text><text x="305.0" y="195.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6B7280">admin · member · viewer</text><rect x="430" y="90" width="170" height="66" rx="14" fill="#ECF8C8" stroke="#D9EFA0" stroke-width="1.5" filter="url(#shadow)"/><text x="515.0" y="115.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A2E05">⬆️  Effective role</text><text x="515.0" y="135.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#4D7C0F">the highest wins</text><rect x="640" y="30" width="290" height="66" rx="14" fill="#C6F432" stroke="#C6F432" stroke-width="1.5" filter="url(#shadow)"/><text x="785.0" y="55.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A2E05">🎛️  Permission matrix</text><text x="785.0" y="75.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1A2E05">per project, per role (20 switches)</text><rect x="640" y="150" width="290" height="66" rx="14" fill="#0E0F11" stroke="#0E0F11" stroke-width="1.5" filter="url(#shadow)"/><text x="785.0" y="175.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#E6E6E6">🔒  Security level</text><text x="785.0" y="195.0" text-anchor="middle" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#C6F432">restricted tickets: invisible to others</text><path d="M182,115 L218,70" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><path d="M182,132 L218,180" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><path d="M392,63 L428,112" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/><path d="M392,183 L428,135" fill="none" stroke="#4D7C0F" stroke-width="2" marker-end="url(#arrow)"/>