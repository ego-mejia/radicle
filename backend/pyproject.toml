[project]
name = "radicle"
version = "0.1.0"
description = "Open source, self-hosted ticket tracker with a built-in MCP server"
license = "AGPL-3.0-only"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "lark>=1.2",
    "mcp>=1.9",
    "httpx>=0.28",
    "procrastinate>=3.10,<4",
    "psycopg[binary,pool]>=3.2",
    "pillow>=11",
    "filetype>=1.2",
    "boto3>=1.35",
    "python-multipart>=0.0.18",
    "jinja2>=3.1",
    "cryptography>=43",
    "authlib>=1.4",
    "markdown-it-py>=3.0",
    "pgvector>=0.3",
    "pycrdt==0.14.8",
    "python-docx>=1.1",
]

[project.scripts]
radicle = "radicle.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "testcontainers[minio,postgres]>=4.8",
    "psycopg[binary]>=3.2",
    "ruff>=0.8",
    "mypy>=1.13",
    "icalendar>=6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["radicle"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown fixtures must stay byte for byte (ruff would format their Python code blocks).
extend-exclude = ["tests/**/*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]
ignore = ["B008", "N818", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S311", "S603"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "radicle.platform.services.*",
    "radicle.docket.services.*",
    "radicle.platform.query.*",
    "radicle.docket.query.*",
    "radicle.folio.services.*",
    "radicle.folio.query.*",
]
strict = true

[tool.pytest.ini_options]
filterwarnings = ["error::DeprecationWarning:radicle.*", "error::sqlalchemy.exc.SADeprecationWarning"]
markers = ["slow: performance checks with 10k tickets"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["radicle"]
branch = true
# SQLAlchemy async runs ORM code inside greenlets.
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
