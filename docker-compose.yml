services:
  app:
    build: .
    # GUMBALL_FACTORY_IMAGE names the image, so a dev checkout (gumball-factory-dev) never
    # replaces the everyday install's image (gumball-factory). Each GUMBALL_FACTORY_* falls
    # back to its pre-rename RADICLE_* twin (ADR 0046).
    image: ${GUMBALL_FACTORY_IMAGE:-${RADICLE_IMAGE:-gumball-factory}}:latest
    ports:
      - "${GUMBALL_FACTORY_PORT:-${RADICLE_PORT:-8000}}:8000"
    environment: &app-env
      GUMBALL_FACTORY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-gumball_factory}:${POSTGRES_PASSWORD:-gumball_factory}@db:5432/${POSTGRES_DB:-gumball_factory}
      GUMBALL_FACTORY_BASE_URL: ${GUMBALL_FACTORY_BASE_URL:-${RADICLE_BASE_URL:-http://localhost:8000}}
      GUMBALL_FACTORY_TIMEZONE: ${GUMBALL_FACTORY_TIMEZONE:-${RADICLE_TIMEZONE:-UTC}}
      GUMBALL_FACTORY_WORKDAYS: ${GUMBALL_FACTORY_WORKDAYS:-${RADICLE_WORKDAYS:-mon,tue,wed,thu,fri}}
      # Required: the app refuses to start without it (openssl rand -hex 32).
      GUMBALL_FACTORY_SECRET_KEY: ${GUMBALL_FACTORY_SECRET_KEY:-${RADICLE_SECRET_KEY:-}}
      GUMBALL_FACTORY_STORAGE: ${GUMBALL_FACTORY_STORAGE:-${RADICLE_STORAGE:-local}}
      GUMBALL_FACTORY_MAX_UPLOAD_MB: ${GUMBALL_FACTORY_MAX_UPLOAD_MB:-${RADICLE_MAX_UPLOAD_MB:-25}}
      GUMBALL_FACTORY_IMAGE_DEFAULT_RESIZE: ${GUMBALL_FACTORY_IMAGE_DEFAULT_RESIZE:-${RADICLE_IMAGE_DEFAULT_RESIZE:-large}}
      GUMBALL_FACTORY_S3_BUCKET: ${GUMBALL_FACTORY_S3_BUCKET:-${RADICLE_S3_BUCKET:-gumball-factory}}
      GUMBALL_FACTORY_S3_ENDPOINT: ${GUMBALL_FACTORY_S3_ENDPOINT:-${RADICLE_S3_ENDPOINT:-}}
      GUMBALL_FACTORY_S3_REGION: ${GUMBALL_FACTORY_S3_REGION:-${RADICLE_S3_REGION:-us-east-1}}
      GUMBALL_FACTORY_S3_ACCESS_KEY: ${GUMBALL_FACTORY_S3_ACCESS_KEY:-${RADICLE_S3_ACCESS_KEY:-}}
      GUMBALL_FACTORY_S3_SECRET_KEY: ${GUMBALL_FACTORY_S3_SECRET_KEY:-${RADICLE_S3_SECRET_KEY:-}}
      GUMBALL_FACTORY_SMTP_HOST: ${GUMBALL_FACTORY_SMTP_HOST:-${RADICLE_SMTP_HOST:-}}
      GUMBALL_FACTORY_SMTP_PORT: ${GUMBALL_FACTORY_SMTP_PORT:-${RADICLE_SMTP_PORT:-587}}
      GUMBALL_FACTORY_SMTP_USER: ${GUMBALL_FACTORY_SMTP_USER:-${RADICLE_SMTP_USER:-}}
      GUMBALL_FACTORY_SMTP_PASSWORD: ${GUMBALL_FACTORY_SMTP_PASSWORD:-${RADICLE_SMTP_PASSWORD:-}}
      GUMBALL_FACTORY_SMTP_FROM: ${GUMBALL_FACTORY_SMTP_FROM:-${RADICLE_SMTP_FROM:-Gumball Factory <gumball-factory@localhost>}}
      GUMBALL_FACTORY_SMTP_TLS: ${GUMBALL_FACTORY_SMTP_TLS:-${RADICLE_SMTP_TLS:-true}}
      GUMBALL_FACTORY_LOGIN_RATE_LIMIT_PER_MINUTE: ${GUMBALL_FACTORY_LOGIN_RATE_LIMIT_PER_MINUTE:-${RADICLE_LOGIN_RATE_LIMIT_PER_MINUTE:-10}}
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
        # The worker's browser opens the print view here: Chromium forces HTTPS for a
        # bare "app" (.app is an HSTS-preloaded domain), so it needs another name.
        aliases: [gumball-factory-web]
    restart: unless-stopped

  # Background jobs (template sync, image variants, bulk edits). Same image as app;
  # it starts after app so migrations have already run.
  worker:
    image: ${GUMBALL_FACTORY_IMAGE:-${RADICLE_IMAGE:-gumball-factory}}:latest
    command: ["gumball-factory", "worker"]
    environment:
      <<: *app-env
      GUMBALL_FACTORY_MIGRATE: "false"
      # PDF exports: the worker's browser opens the app's print view here.
      GUMBALL_FACTORY_INTERNAL_URL: http://gumball-factory-web:8000
    volumes:
      - attachments:/data/attachments
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  db:
    # PostgreSQL 16 on Alpine with pgvector for Folio's search (ADR 0037).
    build: docker/postgres
    image: ${GUMBALL_FACTORY_DB_IMAGE:-${RADICLE_DB_IMAGE:-gumball-factory-postgres}}:16-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gumball_factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gumball_factory}
      POSTGRES_DB: ${POSTGRES_DB:-gumball_factory}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
  attachments:
