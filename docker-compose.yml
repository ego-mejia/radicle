services:
  app:
    build: .
    # RADICLE_IMAGE names the image, so a dev checkout (radicle-dev) never replaces
    # the everyday install's image (radicle).
    image: ${RADICLE_IMAGE:-radicle}:latest
    ports:
      - "${RADICLE_PORT:-8000}:8000"
    environment: &app-env
      RADICLE_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-radicle}:${POSTGRES_PASSWORD:-radicle}@db:5432/${POSTGRES_DB:-radicle}
      RADICLE_BASE_URL: ${RADICLE_BASE_URL:-http://localhost:8000}
      RADICLE_TIMEZONE: ${RADICLE_TIMEZONE:-UTC}
      RADICLE_WORKDAYS: ${RADICLE_WORKDAYS:-mon,tue,wed,thu,fri}
      RADICLE_SECRET_KEY: ${RADICLE_SECRET_KEY:?Set RADICLE_SECRET_KEY in .env, e.g. openssl rand -hex 32}
      RADICLE_STORAGE: ${RADICLE_STORAGE:-local}
      RADICLE_MAX_UPLOAD_MB: ${RADICLE_MAX_UPLOAD_MB:-25}
      RADICLE_IMAGE_DEFAULT_RESIZE: ${RADICLE_IMAGE_DEFAULT_RESIZE:-large}
      RADICLE_S3_BUCKET: ${RADICLE_S3_BUCKET:-radicle}
      RADICLE_S3_ENDPOINT: ${RADICLE_S3_ENDPOINT:-}
      RADICLE_S3_REGION: ${RADICLE_S3_REGION:-us-east-1}
      RADICLE_S3_ACCESS_KEY: ${RADICLE_S3_ACCESS_KEY:-}
      RADICLE_S3_SECRET_KEY: ${RADICLE_S3_SECRET_KEY:-}
      RADICLE_SMTP_HOST: ${RADICLE_SMTP_HOST:-}
      RADICLE_SMTP_PORT: ${RADICLE_SMTP_PORT:-587}
      RADICLE_SMTP_USER: ${RADICLE_SMTP_USER:-}
      RADICLE_SMTP_PASSWORD: ${RADICLE_SMTP_PASSWORD:-}
      RADICLE_SMTP_FROM: ${RADICLE_SMTP_FROM:-Radicle <radicle@localhost>}
      RADICLE_SMTP_TLS: ${RADICLE_SMTP_TLS:-true}
      RADICLE_LOGIN_RATE_LIMIT_PER_MINUTE: ${RADICLE_LOGIN_RATE_LIMIT_PER_MINUTE:-10}
    volumes:
      - attachments:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Background jobs (template sync, image variants, bulk edits). Same image as app;
  # it starts after app so migrations have already run.
  worker:
    image: ${RADICLE_IMAGE:-radicle}:latest
    command: ["radicle", "worker"]
    environment:
      <<: *app-env
      RADICLE_MIGRATE: "false"
    volumes:
      - attachments:/data/attachments
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: unless-stopped

  db:
    # PostgreSQL 16 on Alpine with pgvector for Folio's search (ADR 0037).
    build: docker/postgres
    image: ${RADICLE_DB_IMAGE:-radicle-postgres}:16-pgvector
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radicle}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radicle}
      POSTGRES_DB: ${POSTGRES_DB:-radicle}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
  attachments:
