name: PR size

# Paused with CI: run scripts/pr-size.sh locally. To turn it back on, use again:
#   pull_request:
#     types: [opened, synchronize, reopened, edited]
on:
  workflow_dispatch:

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch name, lines and files
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
          MAX_LINES: 500
          MAX_FILES: 100
        run: scripts/pr-size.sh
