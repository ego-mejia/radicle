name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      # Creating the app (for the OpenAPI export) needs a key; tests set their own.
      RADICLE_SECRET_KEY: ci-only-not-secret-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.8"
      - run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy radicle
      - name: Tests (Postgres via testcontainers, includes migration up/down/up)
        run: uv run pytest --cov --cov-report=term --cov-fail-under=70
      - name: Coverage of services/ and query/ (min 85%)
        run: uv run coverage report --include="radicle/services/*,radicle/query/*" --fail-under=85
      - name: OpenAPI client is up to date
        run: |
          uv run python ../scripts/export_openapi.py
          git diff --exit-code ../frontend/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated API types are up to date
        run: pnpm api:types && git diff --exit-code src/services/api/schema.d.ts
      - run: pnpm check
      - run: pnpm build

  image:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image and run smoke test
        env:
          RADICLE_SECRET_KEY: ci-only-not-secret-0123456789abcdef
        run: scripts/smoke.sh

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Start Radicle on a fresh database
        env:
          RADICLE_SECRET_KEY: ci-only-not-secret-0123456789abcdef
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS localhost:8000/health && break; sleep 2; done
      - name: Playwright
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
